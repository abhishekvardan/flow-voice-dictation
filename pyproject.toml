[project]
name = "flow"
version = "0.1.0"
description = "Local Wispr Flow replica: hold a hotkey, speak, and polished text is typed into any app (faster-whisper + Ollama)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26",
    "PySide6>=6.7",
    "httpx>=0.27",
    "pywin32>=306",
    "psutil>=5.9",
]

[project.optional-dependencies]
# CUDA runtime libraries for running Whisper on an NVIDIA GPU.
gpu = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
